<section class="py-20 bg-white">
  <div class="container mx-auto px-6">
    <h2 class="text-4xl font-bold text-center mb-16 text-gray-900 -mt-[10px]">Contact Us</h2>
    <p class="text-center text-xl text-gray-700 mb-12 max-w-2xl mx-auto">Get in touch with our team. We're here to help with any questions or inquiries you may have. Fill out the form below and we'll get back to you as soon as possible.</p>
    <div class="flex flex-col lg:flex-row justify-center items-stretch gap-0">
      <img src="/contact.png" alt="Contact" class="w-full lg:w-1/2 mx-auto lg:mx-0 rounded-2xl">
      <div class="bg-blue-600 w-full lg:w-1/2 rounded-2xl">
        <form class="p-20">
          <div class="mb-6">
            <label class="block text-gray-800 font-semibold mb-3 text-lg" for="name">Name</label>
            <div class="relative">
              <input class="w-full px-4 py-4 pl-14 border-2 border-gray-200 rounded-xl bg-white text-gray-900 placeholder-gray-400 focus:border-indigo-500 focus:ring-4 focus:ring-indigo-200 transition-all duration-200 font-medium" type="text" id="name" name="name" placeholder="Enter your full name">
              <svg class="w-6 h-6 absolute left-4 top-4 text-gray-400 animate-pulse" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd"/>
              </svg>
            </div>
          </div>
          <div class="mb-6">
            <label class="block text-gray-800 font-semibold mb-3 text-lg" for="email">Email</label>
            <div class="relative">
              <input class="w-full px-4 py-4 pl-14 border-2 border-gray-200 rounded-xl bg-white text-gray-900 placeholder-gray-400 focus:border-indigo-500 focus:ring-4 focus:ring-indigo-200 transition-all duration-200 font-medium" type="email" id="email" name="email" placeholder="your.email@example.com">
              <svg class="w-6 h-6 absolute left-4 top-4 text-gray-400 animate-pulse" fill="currentColor" viewBox="0 0 20 20">
                <path d="M2.003 5.884L10 9.882l7.997-3.998A2 2 0 0016 4H4a2 2 0 00-1.997 1.884z"/>
                <path d="M18 8.118l-8 4-8-4V14a2 2 0 002 2h12a2 2 0 002-2V8.118z"/>
              </svg>
            </div>
          </div>
          <div class="mb-8">
            <label class="block text-gray-800 font-semibold mb-3 text-lg" for="message">Message</label>
            <div class="relative">
              <textarea class="w-full px-4 py-4 pl-14 border-2 border-gray-200 rounded-xl bg-white text-gray-900 placeholder-gray-400 focus:border-indigo-500 focus:ring-4 focus:ring-indigo-200 transition-all duration-200 font-medium resize-none" id="message" name="message" rows="5" placeholder="Tell us about your inquiry..."></textarea>
              <svg class="w-6 h-6 absolute left-4 top-4 text-gray-400 animate-pulse" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M18 10c0 3.866-3.582 7-8 7a8.841 8.841 0 01-4.083-.98L2 17l1.338-3.123C2.493 12.767 2 11.434 2 10c0-3.866 3.582-7 8-7s8 3.134 8 7zM7 9H5v2h2V9zm8 0h-2v2h2V9zM9 9h2v2H9V9z" clip-rule="evenodd"/>
              </svg>
            </div>
          </div>
          <button class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 text-black py-4 px-8 rounded-xl font-bold text-lg hover:from-indigo-700 hover:to-purple-700 hover:scale-105 hover:shadow-xl transition-all duration-300 flex items-center justify-center gap-2" type="submit">
            <span>Send Message</span>
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/>
            </svg>
          </button>
        </form>
      </div>
    </div>
  </div>
</section>
