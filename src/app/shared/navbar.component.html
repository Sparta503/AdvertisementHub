<header class="bg-white">
  <!-- Top Contact Bar -->
  <div class="bg-blue-600 py-2">
    <div class="container mx-auto px-6 flex justify-between items-center text-2xl text-white">
      <span>Contact us: Chomunodisaa68@gmail.com</span>
      <span>Phone: +263 78 048 8779</span>
    </div>
  </div>

  <nav class="bg-blue-600 rounded-3xl container mx-auto px-6 py-4 mt-4 mb-4">
    <div class="flex items-center">
      
      <!-- Logo -->
      <div class="flex items-center space-x-2">
        <img src="/Hospital.png" alt="Hospital Logo" class="w-12 h-12 bg-white p-1">
      </div>

      <!-- Desktop Menu (Centered) -->
      <div class="flex-1 flex justify-center">
        <ul class="hidden md:flex items-center space-x-8 text-white font-medium">
          <li><a routerLink="/" class="px-4 py-2 rounded-lg text-white transition-all duration-200 ease-out hover:bg-white/10 hover:-translate-y-0.5 hover:shadow-md active:translate-y-0">Home</a></li>
          <li><a routerLink="/about" class="px-4 py-2 rounded-lg text-white transition-all duration-200 ease-out hover:bg-white/10 hover:-translate-y-0.5 hover:shadow-md active:translate-y-0">About</a></li>
          <li><a routerLink="/doctors" class="px-4 py-2 rounded-lg text-white transition-all duration-200 ease-out hover:bg-white/10 hover:-translate-y-0.5 hover:shadow-md active:translate-y-0">Doctors</a></li>
          <li><a routerLink="/services" class="px-4 py-2 rounded-lg text-white transition-all duration-200 ease-out hover:bg-white/10 hover:-translate-y-0.5 hover:shadow-md active:translate-y-0">Services</a></li>
          <li><a routerLink="/contact" class="px-4 py-2 rounded-lg text-white transition-all duration-200 ease-out hover:bg-white/10 hover:-translate-y-0.5 hover:shadow-md active:translate-y-0">Contact</a></li>
        </ul>
      </div>

      <!-- Appointment Button -->
      <div class="hidden md:block">
        <button (click)="openModal()" class="bg-white text-blue-600 px-5 py-2 rounded-lg font-medium hover:bg-black hover:text-white hover:scale-105 hover:shadow-lg transition">
          Book Appointment
        </button>
      </div>

      <!-- Mobile Menu Button -->
      <button
        class="md:hidden text-white ml-4 hover:bg-black hover:scale-105 hover:shadow-lg"
        (click)="toggleMenu()"
      >
        ☰
      </button>

    </div>

    <!-- Mobile Menu -->
    <div *ngIf="menuOpen" class="md:hidden absolute top-full left-0 right-0 bg-white shadow-lg">
      <ul class="flex flex-col space-y-2 p-4">
        <li><a routerLink="/" class="bg-black text-white transition px-3 py-2 rounded-lg hover:text-white hover:animate-pulse hover:shadow-2xl hover:scale-95 hover:border-b-2 hover:border-white active:scale-95" (click)="menuOpen = false">Home</a></li>
        <li><a routerLink="/about" class="bg-black text-white transition px-3 py-2 rounded-lg hover:text-white hover:animate-pulse hover:shadow-2xl hover:scale-95 hover:border-b-2 hover:border-white active:scale-95" (click)="menuOpen = false">About</a></li>
        <li><a routerLink="/doctors" class="bg-black text-white transition px-3 py-2 rounded-lg hover:text-white hover:animate-pulse hover:shadow-2xl hover:scale-95 hover:border-b-2 hover:border-white active:scale-95" (click)="menuOpen = false">Doctors</a></li>
        <li><a routerLink="/services" class="bg-black text-white transition px-3 py-2 rounded-lg hover:text-white hover:animate-pulse hover:shadow-2xl hover:scale-95 hover:border-b-2 hover:border-white active:scale-95" (click)="menuOpen = false">Services</a></li>
        <li><a routerLink="/contact" class="bg-black text-white transition px-3 py-2 rounded-lg hover:text-white hover:animate-pulse hover:shadow-2xl hover:scale-95 hover:border-b-2 hover:border-white active:scale-95" (click)="menuOpen = false">Contact</a></li>
        <li><button (click)="openModal(); menuOpen = false" class="block py-2 text-blue-600 hover:bg-black hover:text-white hover:scale-105 hover:shadow-lg transition">Book Appointment</button></li>
      </ul>
    </div>

  </nav>
</header>
